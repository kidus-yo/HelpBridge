components:
  schemas:
    AIStatusResponse:
      type: object
      properties:
        status:
          type: string
          default: healthy
        active_provider:
          type: string
        supported_providers:
          type: array
          items:
            type: string
        grounding_threshold:
          type: number
          format: double
        supported_languages:
          type: array
          items:
            type: string
        offline_fallback_enabled:
          type: boolean
          default: true
      required:
      - active_provider
      - grounding_threshold
      - supported_languages
      - supported_providers
    AccommodationRequest:
      type: object
      description: |-
        Privacy-First accommodation request serializer.
        Focuses solely on functional adjustments without requesting medical diagnosis.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job_listing:
          type: string
          format: uuid
          nullable: true
        job_title:
          type: string
          readOnly: true
        functional_needs:
          description: Functional adjustments required (e.g. screen reader compatible
            environment, extra time, captions)
        description:
          type: string
          description: Specific functional requests or setup requirements.
        preferred_contact_method:
          $ref: '#/components/schemas/PreferredContactMethodEnum'
        contact_details:
          type: string
          maxLength: 255
        status:
          allOf:
          - $ref: '#/components/schemas/AccommodationStatusEnum'
          readOnly: true
        coordinator_response:
          type: string
          readOnly: true
        guest_token:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contact_details
      - coordinator_response
      - created_at
      - description
      - guest_token
      - id
      - job_title
      - status
      - updated_at
    AccommodationRequestRequest:
      type: object
      description: |-
        Privacy-First accommodation request serializer.
        Focuses solely on functional adjustments without requesting medical diagnosis.
      properties:
        job_listing:
          type: string
          format: uuid
          nullable: true
        functional_needs:
          description: Functional adjustments required (e.g. screen reader compatible
            environment, extra time, captions)
        description:
          type: string
          minLength: 1
          description: Specific functional requests or setup requirements.
        preferred_contact_method:
          $ref: '#/components/schemas/PreferredContactMethodEnum'
        contact_details:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - contact_details
      - description
    AccommodationStatusEnum:
      enum:
      - submitted
      - reviewing
      - responded
      - closed
      type: string
      description: |-
        * `submitted` - Submitted
        * `reviewing` - Reviewing
        * `responded` - Responded / Accommodations Arranged
        * `closed` - Closed
    ActionEnum:
      enum:
      - start
      - stop
      type: string
      description: |-
        * `start` - start
        * `stop` - stop
    AnswerRequestRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          description: Learner's course or platform question
          maxLength: 1000
        course_id:
          type: string
          minLength: 1
          default: course-va-101
          description: Target course identifier
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: am
          description: |-
            Language code ('en' or 'am')

            * `en` - en
            * `am` - am
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          description: |-
            Optional AI provider override for testing

            * `offline` - offline
            * `cloud` - cloud
            * `local` - local
            * `mock` - mock
      required:
      - question
    AnswerResponse:
      type: object
      properties:
        answer:
          type: string
        language:
          type: string
        grounded:
          type: boolean
        fallback_used:
          type: boolean
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        provider:
          type: string
      required:
      - answer
      - citations
      - fallback_used
      - grounded
      - language
      - provider
