        or update/publish/close job listing (staff only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/jobs/questions/:
    post:
      operationId: api_v1_jobs_questions_create
      description: Answers questions about published job details without hallucinating
        omitted fields.
      summary: Grounded Job Q&A
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobQuestionRequestRequest'
          application/x-www-form-urlencoded:
