              schema:
                $ref: '#/components/schemas/JobAlertSubscription'
          description: ''
    delete:
      operationId: api_v1_job_alerts_subscriptions_destroy
      description: Retrieve, update keywords/status, or unsubscribe from job alerts.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/jobs/:
    get:
      operationId: api_v1_jobs_list
      description: |-
        List published job opportunities for learners (with search/filtering),
        or create a new job listing (staff/admin only).
      summary: List published jobs
      parameters:
      - in: query
        name: employment_type
        schema:
          type: string
        description: Filter by full_time, part_time, internship, contract
      - in: query
        name: location
        schema:
          type: string
        description: Filter by location (e.g. Addis Ababa)
      - in: query
        name: remote_policy
        schema:
          type: string
        description: Filter by remote, hybrid, on_site
      - in: query
        name: search
        schema:
          type: string
        description: Search keyword in title, organization, description
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobListing'
          description: ''
    post:
      operationId: api_v1_jobs_create
      description: |-
        List published job opportunities for learners (with search/filtering),
        or create a new job listing (staff/admin only).
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListing'
          description: ''
  /api/v1/jobs/{id}/:
    get:
      operationId: api_v1_jobs_retrieve
      description: |-
        Retrieve job details (learners only view published),
        or update/publish/close job listing (staff only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListing'
          description: ''
    put:
      operationId: api_v1_jobs_update
