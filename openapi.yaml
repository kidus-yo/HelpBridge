          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJobAlertSubscriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJobAlertSubscriptionRequest'
      security:
      - cookieAuth: []
