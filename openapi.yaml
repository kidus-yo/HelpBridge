openapi: 3.0.3
info:
  title: Digital Bridge Assistant API
  version: 1.0.0
  description: 'Level 2 REST API for Digital Bridge Assistant (Track 3: Multilingual
    Assistant & Live Help). Provides retrieval-grounded course Q&A in English and
    Amharic, offline FAQ fallback, Telegram bot webhook, and 160-char low-bandwidth
    SMS delivery adapter.'
paths:
  /api/v1/accommodations/:
    get:
      operationId: api_v1_accommodations_list
      description: |-
        Submit an interview accommodation request (privacy-preserving, functional adjustments only),
        or list submitted requests for the learner/guest or staff.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccommodationRequest'
          description: ''
    post:
      operationId: api_v1_accommodations_create
      description: |-
        Submit an interview accommodation request (privacy-preserving, functional adjustments only),
        or list submitted requests for the learner/guest or staff.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccommodationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccommodationRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationRequest'
          description: ''
  /api/v1/accommodations/{id}/:
    get:
      operationId: api_v1_accommodations_retrieve
      description: |-
        View status of accommodation request (learner/guest or staff),
        or update/respond (staff only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationRequest'
          description: ''
    put:
      operationId: api_v1_accommodations_update
      description: |-
        View status of accommodation request (learner/guest or staff),
        or update/respond (staff only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccommodationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccommodationRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationRequest'
          description: ''
    patch:
      operationId: api_v1_accommodations_partial_update
      description: |-
        View status of accommodation request (learner/guest or staff),
        or update/respond (staff only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccommodationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccommodationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccommodationRequestRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationRequest'
          description: ''
  /api/v1/ai/answer/:
    post:
      operationId: api_v1_ai_answer_create
      description: Answer a question grounded in course materials. Cites document
        title, section, and page. Refuses honestly if no evidence is found.
      summary: Generate Grounded Course Answer
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnswerRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnswerRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
          description: Successful answer
        '400':
          description: Invalid request data
  /api/v1/ai/status/:
    get:
      operationId: api_v1_ai_status_retrieve
      description: Check status, active provider, and language capabilities of the
        AI Engine.
      summary: AI Engine Status
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStatusResponse'
          description: ''
  /api/v1/channels/deliveries/{delivery_id}/:
    get:
      operationId: api_v1_channels_deliveries_retrieve
      description: Retrieve delivery tracking details for an outbound SMS or Telegram
        notification.
      summary: Get Delivery Status
      parameters:
      - in: path
        name: delivery_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDelivery'
          description: ''
        '404':
          description: Delivery record not found
  /api/v1/channels/notifications/send/:
    post:
      operationId: api_v1_channels_notifications_send_create
      description: Dispatches a job alert or system notification to a learner via
        Telegram or SMS.
      summary: Send Outbound Notification (Telegram/SMS)
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationSendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationSendRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDelivery'
          description: Notification queued/delivered
        '400':
          description: Validation error
  /api/v1/channels/sms/inbound/:
    get:
      operationId: api_v1_channels_sms_inbound_retrieve
      description: Inbound SMS endpoint for low-bandwidth access. Accepts 'from' and
        'text'. Returns plain text course answer of at most 160 characters.
      summary: Inbound SMS Gateway Endpoint
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: Plain text response <= 160 characters
        '400':
          description: Invalid request
    post:
      operationId: api_v1_channels_sms_inbound_create
      description: Inbound SMS endpoint for low-bandwidth access. Accepts 'from' and
        'text'. Returns plain text course answer of at most 160 characters.
      summary: Inbound SMS Gateway Endpoint
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMSInboundRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SMSInboundRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SMSInboundRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: Plain text response <= 160 characters
        '400':
          description: Invalid request
  /api/v1/channels/telegram/webhook/:
    post:
      operationId: api_v1_channels_telegram_webhook_create
      description: Receives Telegram webhook updates from Telegram Bot servers.
      summary: Telegram Bot Webhook
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramWebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelegramWebhookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelegramWebhookRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: Update received and processed successfully
  /api/v1/job-alerts/subscriptions/:
    get:
      operationId: api_v1_job_alerts_subscriptions_list
      description: Subscribe to job alert notifications via Telegram or low-bandwidth
