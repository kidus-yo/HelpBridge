services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python backend/manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-digital-bridge-hackathon-2026-demo-key
      - ALLOWED_HOSTS=*
      - AI_PROVIDER=offline
    restart: unless-stopped
