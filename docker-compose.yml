services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: helpbridge
      POSTGRES_USER: helpbridge
      POSTGRES_PASSWORD: helpbridge
    ports:
      - "5432:5432"
    volumes:
      - helpbridge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python backend/manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DEBUG: "True"
      DJANGO_ENV: development
      SECRET_KEY: django-insecure-digital-bridge-hackathon-2026-demo-key
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://helpbridge:helpbridge@db:5432/helpbridge
      AI_PROVIDER: offline
      PLATFORM_CONTEXT_SIGNING_KEY: django-insecure-platform-context-demo-key
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  helpbridge_pg:
